name: Build Releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Regression Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression checks
        run: npm run regression

  windows:
    name: Windows
    needs: regression
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows packages
        run: npm run dist -- --win nsis portable --x64 --publish never

      - name: Verify packaged Windows native drag addon
        run: node scripts/native-sftp-drag-artifacts-check.js windows packaged release

      - name: Verify Windows artifact names
        run: node scripts/release-artifacts-check.js windows

      - name: Upload Windows workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Terma-windows-x64
          overwrite: true
          retention-days: 7
          path: |
            release/*.exe
            release/*.blockmap

  linux:
    name: Linux
    needs: regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            fuse3 \
            libcurl4-openssl-dev \
            libfuse3-dev \
            nlohmann-json3-dev \
            pkg-config \
            rpm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux packages
        run: npm run dist -- --linux AppImage deb rpm --x64 --publish never

      - name: Verify packaged Linux native drag helper
        run: node scripts/native-sftp-drag-artifacts-check.js linux packaged release

      - name: Verify Linux artifact names
        run: node scripts/release-artifacts-check.js linux

      - name: Upload Linux workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Terma-linux-x64
          overwrite: true
          retention-days: 7
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.blockmap

  macos:
    name: macOS
    needs: regression
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS packages
        run: npm run dist -- --mac dmg zip --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify packaged macOS native drag addons
        run: node scripts/native-sftp-drag-artifacts-check.js macos packaged release

      - name: Verify macOS artifact names
        run: node scripts/release-artifacts-check.js macos

      - name: Verify packaged PTY helper
        shell: bash
        run: |
          find release -path '*/Contents/Resources/app.asar.unpacked/node_modules/node-pty/*' -type f -name spawn-helper -print > /tmp/terma-pty-helpers.txt
          test -s /tmp/terma-pty-helpers.txt
          while IFS= read -r helper; do
            test -x "$helper"
          done < /tmp/terma-pty-helpers.txt
      - name: Verify packaged macOS icon
        shell: bash
        run: |
          PRODUCT_FILENAME="$(node -p 'require("./package.json").build.executableName || require("./package.json").build.productName')"
          app_count=0
          while IFS= read -r plist; do
            app_count=$((app_count + 1))
            icon_file="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$plist")"
            test "$icon_file" = "icon.icns"
            icon_path="$(dirname "$plist")/Resources/$icon_file"
            test -s "$icon_path"
            iconset_dir="$(mktemp -d)/Terma.iconset"
            /usr/bin/iconutil -c iconset "$icon_path" -o "$iconset_dir"
            test -s "$iconset_dir/icon_512x512@2x.png"
            node scripts/mac-icon-padding-check.js "$iconset_dir/icon_512x512@2x.png"
          done < <(find release -path "*/${PRODUCT_FILENAME}.app/Contents/Info.plist" -type f -print)
          test "$app_count" -eq 2
      - name: Upload macOS workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Terma-macos-x64-arm64
          overwrite: true
          retention-days: 7
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap

  linux-source:
    name: Linux Source
    needs: regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Create Linux/source tarball
        shell: bash
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          PRODUCT_NAME="$(node -p 'require("./package.json").build.productName')"
          PRODUCT_SLUG="$(node -p 'require("./package.json").name')"
          mkdir -p release-source
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='release' \
            --exclude='release-source' \
            --exclude='data' \
            --exclude='.ssh' \
            --transform="s,^\./,${PRODUCT_SLUG}/," \
            --transform="s,^\.$,${PRODUCT_SLUG}," \
            -czf "release-source/${PRODUCT_NAME}-${VERSION}-linux-source-noarch.tar.gz" .

      - name: Verify Linux/source artifact name
        shell: bash
        run: |
          node scripts/release-artifacts-check.js linux-source release-source
          PRODUCT_SLUG="$(node -p 'require("./package.json").name')"
          archive="$(find release-source -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$archive"
          tar -tzf "$archive" | grep "^${PRODUCT_SLUG}/" > /dev/null

      - name: Upload Linux/source workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Terma-linux-source-noarch
          overwrite: true
          retention-days: 7
          path: release-source/*.tar.gz

  publish-release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - windows
      - linux
      - macos
      - linux-source
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Download all platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          digest-mismatch: error
          pattern: Terma-*
          path: release-assets
          merge-multiple: true

      - name: Validate release version and revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          REVISION="$(node -p 'Number(require("./package.json").releaseRevision || 0)')"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          test "$REVISION" -ge 0
          if release_json="$(gh release view "$GITHUB_REF_NAME" --json isDraft,body,tagName 2>/dev/null)"; then
            state="$(printf '%s' "$release_json" | jq -r '.isDraft')"
            tag_name="$(printf '%s' "$release_json" | jq -r '.tagName')"
            body="$(printf '%s' "$release_json" | jq -r '.body // ""')"
            remote_revision="$(printf '%s\n' "$body" | sed -nE 's/.*terma-release-revision[[:space:]]*:[[:space:]]*([0-9]+).*/\1/p' | head -n 1)"
            remote_revision="${remote_revision:-0}"
            test "$tag_name" = "$GITHUB_REF_NAME"
            if [ "$state" != "true" ]; then
              test "$REVISION" -gt "$remote_revision"
              gh release edit "$GITHUB_REF_NAME" --draft=true
              echo "Moved public $GITHUB_REF_NAME to draft for explicit same-version revision $REVISION (remote $remote_revision)."
            else
              test "$REVISION" -ge "$remote_revision"
            fi
          fi

      - name: Remove existing release assets before replacement
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft >/dev/null 2>&1; then
            gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[] | [(.apiUrl | split("/")[-1]), .name] | @tsv' | while IFS=$'\t' read -r asset_id asset_name; do
              [ -z "$asset_id" ] && continue
              deleted=false
              for attempt in 1 2 3 4 5; do
                if gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"; then
                  deleted=true
                  break
                fi
                if ! gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" >/dev/null 2>&1; then
                  deleted=true
                  break
                fi
                echo "Retrying deletion of $asset_name after GitHub API failure (attempt $attempt/5)." >&2
                sleep $((attempt * 2))
              done
              if [ "$deleted" != "true" ]; then
                echo "Failed to delete existing release asset: $asset_name ($asset_id)." >&2
                exit 1
              fi
            done
          fi

      - name: Generate CycloneDX SBOM
        shell: bash
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          npm sbom \
            --package-lock-only \
            --omit=dev \
            --sbom-format=cyclonedx \
            --sbom-type=application \
            > "release-assets/Terma-${VERSION}-sbom.cdx.json"

      - name: Verify release set and generate SHA256SUMS
        run: node scripts/release-publish-assets.js prepare release-assets

      - name: Create release notes
        run: node scripts/release-notes.js

      - name: Upload complete draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          fail_on_unmatched_files: true
          overwrite_files: true
          body_path: release-notes.md
          files: release-assets/*

      - name: Verify uploaded release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' > uploaded-assets.txt
          node scripts/release-publish-assets.js verify-remote release-assets uploaded-assets.txt

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
