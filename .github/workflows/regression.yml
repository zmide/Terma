name: Regression

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  regression:
    name: Ubuntu / Node.js 22
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression checks
        run: npm run regression

      - name: Prepare artifact round-trip fixture
        shell: bash
        run: |
          mkdir -p data/actions-node24-smoke
          printf '%s\n' "Terma Actions Node 24 smoke: ${GITHUB_SHA}" > data/actions-node24-smoke/payload.txt
          echo "TERMA_ACTIONS_SMOKE_SHA=$(sha256sum data/actions-node24-smoke/payload.txt | cut -d ' ' -f 1)" >> "$GITHUB_ENV"

      - name: Upload artifact round-trip fixture
        id: roundtrip-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terma-actions-node24-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 1
          path: data/actions-node24-smoke/payload.txt

      - name: Wait for artifact visibility
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          TERMA_ARTIFACT_ID: ${{ steps.roundtrip-upload.outputs.artifact-id }}
        run: |
          if [[ ! "$TERMA_ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid uploaded artifact ID"
            exit 1
          fi
          for attempt in {1..12}; do
            if gh api -H "Cache-Control: no-cache" \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired == false) | .id' \
              | grep -Fxq "$TERMA_ARTIFACT_ID"; then
              exit 0
            fi
            if [[ "$attempt" -lt 12 ]]; then sleep 5; fi
          done
          echo "::error::Uploaded artifact did not become visible within the retry limit"
          exit 1

      - name: Download artifact round-trip fixture
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          # A name-filtered lookup avoids the eventually consistent full-run list.
          name: terma-actions-node24-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/actions-node24-roundtrip

      - name: Verify artifact round-trip digest
        shell: bash
        run: |
          test -f data/actions-node24-roundtrip/payload.txt
          test "$(sha256sum data/actions-node24-roundtrip/payload.txt | cut -d ' ' -f 1)" = "$TERMA_ACTIONS_SMOKE_SHA"

  ui-smoke:
    name: Ubuntu / Electron UI smoke
    if: always()
    needs: ui-scenarios
    runs-on: ubuntu-latest
    steps:
      - name: Require every UI group
        env:
          UI_RESULT: ${{ needs.ui-scenarios.result }}
        run: test "$UI_RESULT" = success

  ui-scenarios:
    name: UI / ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [base, workspace, terminal, files, operations, remote]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-noto-cjk fonts-liberation

      - name: Run Electron UI smoke checks
        env:
          TERMA_UI_GROUP: ${{ matrix.group }}
          TERMA_UI_NO_SANDBOX: "1"
          TERMA_UI_SCREENSHOT: "1"
          TERMA_UI_SMOKE_TIMEOUT_MS: "900000"
          TERMA_UI_VISUAL_DIR: data/ui-visual-current
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" npm run ui:smoke

      - name: Upload UI diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-smoke-diagnostics-${{ matrix.group }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 3
          path: |
            data/**/*.png
            data/**/*report.json

  windows-source:
    name: Windows / Node.js 22
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and type-check
        run: |
          npm run build
          npm run check:strict

      - name: Verify Windows native source contracts
        run: |
          node native/win-sftp-drag/tests/source-contract-check.js
          node scripts/native-sftp-drag-desktop-check.js

  macos-source:
    name: macOS / Node.js 22
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and type-check
        run: |
          npm run build
          npm run check:strict

      - name: Verify macOS desktop source contracts
        run: |
          node scripts/mac-icon-padding-check.js desktop/assets/icon-macos.png
          node scripts/native-sftp-drag-desktop-check.js
