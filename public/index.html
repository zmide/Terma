<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="terma-csp-nonce" content="__TERMA_CSP_NONCE__">
  <title>Terma</title>
  <script src="/csp-bootstrap.js?v=__TERMA_VERSION__"></script>
  <link rel="stylesheet" href="/vendor/xterm/xterm.css?v=__TERMA_VERSION__">
  <link rel="stylesheet" href="/vendor/ace/ace.css?v=__TERMA_VERSION__">
  <link rel="stylesheet" href="/vendor/ace/theme-textmate.css?v=__TERMA_VERSION__">
  <link rel="stylesheet" href="/vendor/ace/theme-tomorrow_night.css?v=__TERMA_VERSION__">
  <link rel="stylesheet" href="/app.css?v=__TERMA_VERSION__">
  <link rel="stylesheet" href="/app-theme-glass.css?v=__TERMA_VERSION__">
</head>
<body>
  <div id="toast" class="notification-stack" aria-live="polite" aria-label="通知" data-i18n-aria-label="common:log_display.notification"></div>
  <div id="modal" class="modal" hidden></div>
  <div class="app">
    <div class="left-pane">
      <div class="brand">
        <h1 aria-label="Terma"><img class="brand-mark" src="/assets/terma-icon.png" alt="" aria-hidden="true"><span class="brand-name-full" aria-hidden="true">Terma</span></h1>
        <button id="operationPaneExpand" class="operation-pane-expand icon-button" type="button" data-action="static-operation-expand" title="展开操作区" data-i18n-title="common:auto.expand_operation_pane" aria-label="展开操作区" data-i18n-aria-label="common:auto.expand_operation_pane"><img class="brand-mark" src="/assets/terma-icon.png" alt="" aria-hidden="true"></button>
        <div class="side-actions">
          <button id="operationPanePin" class="operation-pane-pin icon-button is-pinned" type="button" data-icon="pin" data-action="static-operation-pin" data-i18n-skip="true" title="操作区已固定；点击改为自动收起" aria-label="操作区已固定；点击改为自动收起" aria-pressed="true"><i data-lucide="pin"></i></button>
          <button id="operationPaneCollapse" class="operation-pane-collapse icon-button" type="button" data-action="static-operation-collapse" title="收起操作区" data-i18n-title="common:auto.collapse_operation_pane" aria-label="收起操作区" data-i18n-aria-label="common:auto.collapse_operation_pane"><i data-lucide="panel-left-close"></i></button>
          <button id="mobileLanguageToggle" class="mobile-brand-action language-toggle icon-button" type="button" data-action="static-language-toggle" title="切换到 English" data-i18n-title="login:switch_language" aria-label="切换到 English" data-i18n-aria-label="login:switch_language"><i data-lucide="languages"></i></button>
          <button class="mobile-brand-action theme-toggle icon-button" data-action="static-theme-toggle" title="切换为暗色" data-i18n-title="common:auto.switch_to_dark" aria-label="切换为暗色" data-i18n-aria-label="common:auto.switch_to_dark"><i data-lucide="moon"></i></button>
          <button class="mobile-brand-action icon-button" data-action="static-refresh" title="刷新数据" data-i18n-title="common:auto.refresh_data" aria-label="刷新数据" data-i18n-aria-label="common:auto.refresh_data"><i data-lucide="refresh-cw"></i></button>
        </div>
        <div id="operationPanePinGuide" class="operation-pane-pin-guide" role="region" aria-label="操作区使用提示" data-i18n-aria-label="common:auto.operation_pane_guide" aria-live="polite" hidden>
          <div><strong data-i18n="common:auto.pin_operation_pane">固定操作区</strong><span data-i18n="common:auto.operation_pane_guide_text">取消固定后，点击工作区会自动收起；每个操作区都可以单独设置。</span></div>
          <button class="icon-button" type="button" data-action="static-operation-guide-dismiss" title="知道了" data-i18n-title="common:auto.got_it" aria-label="关闭提示" data-i18n-aria-label="common:auto.close_hint"><i data-lucide="x"></i></button>
        </div>
      </div>
      <div class="left-body">
        <nav class="activity" aria-label="主导航" data-i18n-aria-label="common:auto.main_navigation">
          <div class="activity-top">
            <button id="navConnections" class="active" data-action="static-primary" data-primary="connections" data-explorer="true" title="连接列表" data-i18n-title="navigation:auto.connections" aria-label="连接列表" data-i18n-aria-label="navigation:auto.connections"><i data-lucide="server"></i></button>
            <button id="navRemote" data-action="static-primary" data-primary="remote" data-explorer="true" title="其他连接" data-i18n-title="navigation:auto.remote" aria-label="其他连接" data-i18n-aria-label="navigation:auto.remote"><i data-lucide="plug-zap"></i></button>
            <button id="navRunning" data-action="static-primary" data-primary="running" data-explorer="true" title="转发列表" data-i18n-title="navigation:auto.running" aria-label="转发列表" data-i18n-aria-label="navigation:auto.running"><i data-lucide="route"></i></button>
            <button id="navCommand" data-action="static-primary" data-primary="command" data-explorer="true" title="批量命令" data-i18n-title="navigation:auto.batch" aria-label="批量命令" data-i18n-aria-label="navigation:auto.batch"><i data-lucide="square-terminal"></i></button>
            <button id="navImport" data-action="static-primary" data-primary="import" data-explorer="true" title="导入导出" data-i18n-title="navigation:auto.import_export" aria-label="导入导出" data-i18n-aria-label="navigation:auto.import_export"><i data-lucide="arrow-left-right"></i></button>
            <button id="navLogs" data-action="static-primary" data-primary="logs" data-explorer="true" title="日志" data-i18n-title="navigation:auto.logs" aria-label="日志" data-i18n-aria-label="navigation:auto.logs"><i data-lucide="scroll-text"></i></button>
            <button id="navSettings" data-action="static-primary" data-primary="settings" data-explorer="true" title="设置" data-i18n-title="settings:title" aria-label="设置" data-i18n-aria-label="settings:title"><i data-lucide="settings"></i><span id="navSettingsUpdateDot" class="nav-update-dot" hidden aria-label="发现新版本" data-i18n-aria-label="common:auto.new_version"></span></button>
          </div>
          <div class="activity-bottom">
            <button id="languageToggle" class="language-toggle" type="button" data-action="static-language-toggle" title="切换到 English" data-i18n-title="login:switch_language" aria-label="切换到 English" data-i18n-aria-label="login:switch_language"><i data-lucide="languages"></i></button>
            <button id="themeToggle" class="theme-toggle" type="button" data-action="static-theme-toggle" title="切换为暗色" data-i18n-title="common:auto.switch_to_dark" aria-label="切换为暗色" data-i18n-aria-label="common:auto.switch_to_dark"><i data-lucide="moon"></i></button>
            <button id="activityRefresh" type="button" data-action="static-refresh" title="刷新数据" data-i18n-title="common:auto.refresh_data" aria-label="刷新数据" data-i18n-aria-label="common:auto.refresh_data"><i data-lucide="refresh-cw"></i></button>
            <a class="github-link" href="https://github.com/zmide/Terma" target="_blank" rel="noopener" title="GitHub">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 .5a12 12 0 0 0-3.8 23.4c.6.1.8-.2.8-.6v-2c-3.3.7-4-1.4-4-1.4-.5-1.3-1.2-1.6-1.2-1.6-1-.7.1-.7.1-.7 1.1.1 1.7 1.2 1.7 1.2 1 .1.6 2.1 3.4 1.5.1-.7.4-1.2.7-1.5-2.6-.3-5.4-1.3-5.4-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.6.1-3.2 0 0 1-.3 3.3 1.2a11.4 11.4 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.4 5.9.4.4.8 1.1.8 2.2v3.3c0 .4.2.7.8.6A12 12 0 0 0 12 .5Z"/></svg>
            </a>
          </div>
          <div id="activityBarResize" class="activity-bar-resizer" role="separator" aria-orientation="vertical" aria-label="调整活动栏宽度" data-i18n-aria-label="common:auto.adjust_activity_bar" tabindex="0" title="拖动调整活动栏宽度，双击恢复默认" data-i18n-title="common:auto.adjust_activity_bar_hint"></div>
        </nav>
        <aside id="sidebar" class="sidebar">
          <div class="side-nav">
            <button id="sideConnections" class="active" data-action="static-primary" data-primary="connections" data-i18n="navigation:auto.connections">连接列表</button>
            <button id="sideRemote" data-action="static-primary" data-primary="remote" data-i18n="navigation:auto.remote">其他连接</button>
            <button id="sideImport" data-action="static-primary" data-primary="import" data-i18n="navigation:auto.import_export">导入导出</button>
          </div>
          <div id="explorerTools" class="explorer-tools">
            <button data-action="static-group-add" data-i18n="common:auto.add_group">添加分组</button>
            <button class="primary" data-action="static-connection-new" data-i18n="common:auto.add_ssh">添加 SSH</button>
            <button data-action="static-forwards-start-all" data-i18n="common:auto.start_all_forwards">启动全部转发</button>
            <button data-action="static-forwards-stop-all" data-i18n="common:auto.stop_all_forwards">停止全部转发</button>
          </div>
          <div id="connectionGroups" class="tree"></div>
        </aside>
      </div>
      <div id="operationPaneResize" class="operation-pane-resizer" role="separator" aria-orientation="vertical" aria-label="调整操作区宽度" data-i18n-aria-label="common:auto.adjust_operation_pane" tabindex="0" title="拖动调整操作区宽度，双击恢复默认" data-i18n-title="common:auto.adjust_operation_pane_hint"></div>
    </div>

    <main id="content" class="content">
      <div class="mobile-back-bar"><button id="mobileBack" class="mobile-back" type="button" data-action="static-explorer-back" title="返回连接列表" data-i18n-title="common:auto.back_to_connections" aria-label="返回连接列表" data-i18n-aria-label="common:auto.back_to_connections"><i data-lucide="arrow-left"></i></button></div>
      <div class="topbar">
        <div class="workspace-heading">
          <div class="workspace-heading-title"><strong id="workspaceTitle" data-i18n="common:auto.workspace">工作区</strong><button class="icon-button workspace-quick-connect-button" type="button" data-action="quick-connect-open" title="快速打开连接 / 转发" data-i18n-title="common:auto.quick_open" aria-label="快速打开连接 / 转发" data-i18n-aria-label="common:auto.quick_open"><i data-lucide="server"></i></button></div>
          <div id="workspaceSubtitle" class="cmd" data-i18n-skip="true">选择左侧 SSH 后开始操作</div>
        </div>
        <div id="workspaceGlobalHeaderTools" class="workspace-header-tools workspace-global-header-tools" data-workspace-role="global-header-tools" hidden></div>
        <div id="workspaceQuickActions" class="workspace-quick-actions" aria-label="全局快捷操作" data-i18n-aria-label="common:auto.global_quick_actions"></div>
        <div id="sftpTaskCenter" class="sftp-task-center">
          <button id="sftpTaskCenterButton" class="icon-button sftp-task-center-button" type="button" data-action="static-task-center-toggle" data-i18n-skip="true" title="任务中心" aria-label="任务中心" aria-expanded="false" aria-controls="sftpTaskCenterDrawer">
            <span id="sftpTaskCenterIcon" class="sftp-task-center-icon"><i data-lucide="list-checks"></i></span>
            <span id="sftpTaskCenterBadge" class="sftp-task-center-badge" hidden></span>
          </button>
          <span id="sftpTaskCenterProgress" class="sftp-task-center-progress" role="progressbar" aria-label="任务总进度" data-i18n-aria-label="common:auto.task_total_progress" aria-valuemin="0" aria-valuemax="100" hidden><i></i></span>
          <aside id="sftpTaskCenterDrawer" class="sftp-task-center-drawer" aria-label="任务中心" data-i18n-aria-label="tasks:title" hidden>
            <header class="sftp-task-center-head">
              <div><strong data-i18n="tasks:title">任务中心</strong><span id="sftpTaskCenterSummary" data-i18n-skip="true">暂无进行中的任务</span></div>
              <button class="icon-button" type="button" data-action="static-task-center-close" title="关闭任务中心" data-i18n-title="common:auto.close_task_center" aria-label="关闭任务中心" data-i18n-aria-label="common:auto.close_task_center"><i data-lucide="x"></i></button>
            </header>
            <div class="sftp-task-center-tabs" role="tablist" aria-label="任务视图" data-i18n-aria-label="common:auto.task_view">
              <button id="sftpTaskCenterCurrentTab" type="button" role="tab" aria-selected="true" data-action="static-task-center-view" data-task-view="current"><span data-i18n="common:auto.current_tasks">进行中</span><small id="sftpTaskCenterCurrentCount">0</small></button>
              <button id="sftpTaskCenterFailedTab" type="button" role="tab" aria-selected="false" data-action="static-task-center-view" data-task-view="failed"><span data-i18n="tasks:status.failed">失败</span><small id="sftpTaskCenterFailedCount">0</small></button>
              <button id="sftpTaskCenterHistoryTab" type="button" role="tab" aria-selected="false" data-action="static-task-center-view" data-task-view="history"><span data-i18n="common:auto.history">历史记录</span><small id="sftpTaskCenterHistoryCount">0</small></button>
            </div>
            <div id="sftpTaskCenterList" class="sftp-task-center-list" role="tabpanel"></div>
            <footer id="sftpTaskCenterFooter" class="sftp-task-center-footer" hidden>
              <button id="sftpTaskCenterClearButton" class="danger" type="button" data-action="static-task-center-clear"><i data-lucide="trash-2"></i><span id="sftpTaskCenterClearLabel" data-i18n-skip="true">清空历史</span></button>
            </footer>
            <div id="sftpTaskCenterResize" class="sftp-task-center-resize-handle" role="button" tabindex="0" aria-label="调整任务中心大小" data-i18n-aria-label="common:auto.adjust_task_center" title="拖动调整任务中心大小，双击恢复默认" data-i18n-title="common:auto.adjust_task_center_hint" data-pointerdown-action="static-task-resize-start" data-dblclick-action="static-task-resize-reset" data-keydown-action="static-task-resize-key"></div>
          </aside>
        </div>
        <aside id="sftpTaskFloat" class="sftp-task-float" aria-label="任务悬浮进度" data-i18n-aria-label="common:auto.task_floating_progress" data-action="static-task-list-open" hidden></aside>
        <div id="notice" class="notice"></div>
        <div id="workspaceHeaderResize" class="workspace-header-resizer" role="separator" aria-orientation="horizontal" aria-label="调整工作区标题栏高度" data-i18n-aria-label="common:auto.adjust_workspace_header" tabindex="0" title="拖动调整标题栏高度，双击恢复默认" data-i18n-title="common:auto.adjust_workspace_header_hint"></div>
      </div>
      <div id="workspaceDock" class="workspace-dock"></div>
      <template id="workspaceViewsTpl">
        <section id="view-welcome" class="view"></section>
        <section id="view-terminal" class="view" hidden></section>
        <section id="view-forwards" class="view" hidden></section>
        <section id="view-forward-manager" class="view" hidden></section>
        <section id="view-edit" class="view" hidden></section>
        <section id="view-import" class="view" hidden></section>
        <section id="view-log" class="view" hidden></section>
        <section id="view-command" class="view" hidden></section>
        <section id="view-sftp" class="view" hidden></section>
        <section id="view-local-files" class="view" hidden></section>
        <section id="view-settings" class="view" hidden></section>
        <section id="view-dashboard" class="view" hidden></section>
        <section id="view-remote-desktop" class="view" hidden></section>
        <section id="view-remote-terminal" class="view" hidden></section>
        <section id="view-ftp" class="view" hidden></section>
        <section id="view-linux-desktop" class="view" hidden></section>
      </template>
    </main>
  </div>

  <nav class="mobile-tabs">
    <button id="mobileConnections" class="active" data-action="static-primary" data-primary="connections" title="连接列表" data-i18n-title="navigation:auto.connections" aria-label="连接列表" data-i18n-aria-label="navigation:auto.connections"><i data-lucide="server"></i><span class="mobile-tab-label" data-i18n="connections:title">连接</span></button>
    <button id="mobileRemote" data-action="static-primary" data-primary="remote" title="其他连接" data-i18n-title="navigation:auto.remote" aria-label="其他连接" data-i18n-aria-label="navigation:auto.remote"><i data-lucide="plug-zap"></i><span class="mobile-tab-label" data-i18n="common:auto.other">其他</span></button>
    <button id="mobileRunning" data-action="static-primary" data-primary="running" title="转发列表" data-i18n-title="navigation:auto.running" aria-label="转发列表" data-i18n-aria-label="navigation:auto.running"><i data-lucide="route"></i><span class="mobile-tab-label" data-i18n="navigation:auto.running">转发列表</span></button>
    <button id="mobileCommand" data-action="static-primary" data-primary="command" title="批量命令" data-i18n-title="navigation:auto.batch" aria-label="批量命令" data-i18n-aria-label="navigation:auto.batch"><i data-lucide="square-terminal"></i><span class="mobile-tab-label" data-i18n="navigation:auto.batch_short">批量</span></button>
    <button id="mobileImport" data-action="static-primary" data-primary="import" title="导入导出" data-i18n-title="navigation:auto.import_export" aria-label="导入导出" data-i18n-aria-label="navigation:auto.import_export"><i data-lucide="arrow-left-right"></i><span class="mobile-tab-label" data-i18n="navigation:auto.import">导入</span></button>
    <button id="mobileLogs" data-action="static-primary" data-primary="logs" title="日志" data-i18n-title="navigation:auto.logs" aria-label="日志" data-i18n-aria-label="navigation:auto.logs"><i data-lucide="scroll-text"></i><span class="mobile-tab-label" data-i18n="navigation:auto.logs">日志</span></button>
    <button id="mobileSettings" data-action="static-primary" data-primary="settings" title="设置" data-i18n-title="settings:title" aria-label="设置" data-i18n-aria-label="settings:title"><i data-lucide="settings"></i><span class="mobile-tab-label" data-i18n="settings:title">设置</span><span id="mobileSettingsUpdateDot" class="nav-update-dot" hidden aria-label="发现新版本" data-i18n-aria-label="common:auto.new_version"></span></button>
    <a class="mobile-github-link" href="https://github.com/zmide/Terma" target="_blank" rel="noopener" title="GitHub" aria-label="GitHub">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 .5a12 12 0 0 0-3.8 23.4c.6.1.8-.2.8-.6v-2c-3.3.7-4-1.4-4-1.4-.5-1.3-1.2-1.6-1.2-1.6-1-.7.1-.7.1-.7 1.1.1 1.7 1.2 1.7 1.2 1 .1.6 2.1 3.4 1.5.1-.7.4-1.2.7-1.5-2.6-.3-5.4-1.3-5.4-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.6.1-3.2 0 0 1-.3 3.3 1.2a11.4 11.4 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.4 5.9.4.4.8 1.1.8 2.2v3.3c0 .4.2.7.8.6A12 12 0 0 0 12 .5Z"/></svg>
    </a>
  </nav>

<template id="connectionFormTpl">
  <div class="panel">
    <form id="connectionForm">
      <input type="hidden" id="conn_id">
      <div class="grid">
        <div><label data-i18n="common:auto.name">名称</label><input id="conn_name" required placeholder="server-a"></div>
        <div><label data-i18n="connections:auto.group">分组</label><select id="conn_group"></select></div>
      </div>
      <div class="grid">
        <div><label data-i18n="connections:auto.ssh_user">SSH 用户</label><input id="conn_user" required placeholder="root"></div>
        <div><label data-i18n="connections:auto.ssh_host">SSH 主机</label><input id="conn_host" required placeholder="example.com"></div>
      </div>
      <div class="grid3">
        <div><label data-i18n="connections:auto.ssh_port">SSH 端口</label><input id="conn_port" type="number" min="1" max="65535" value="22"></div>
        <div><label data-i18n="connections:auto.sort">排序</label><input id="conn_sort_order" type="number" min="1" max="2147483647" step="1" value="1"></div>
        <div><label data-i18n="connections:auto.auto_start_forwards">启动 Terma 时自动启用转发</label><select id="conn_autostart"><option value="0" data-i18n="common:auto.no">否</option><option value="1" data-i18n="common:auto.yes">是</option></select></div>
      </div>
      <label data-i18n="common:auto.label">标签</label><input id="conn_tags" placeholder="例如：生产 数据库 海外" data-i18n-placeholder="connections:auto.tags_example">
      <div class="auth-switch">
        <label data-i18n="connections:auto.login_method">登录方式</label>
        <select id="conn_auth_type" data-change-action="static-auth-fields"><option value="key" data-i18n="connections:auto.key_login">私钥登录</option><option value="password" data-i18n="connections:auto.password_login">密码登录</option></select>
      </div>
      <div id="keyAuthBox" class="grid">
        <div>
          <label data-i18n="common:auto.private_key">私钥</label>
          <div class="key-picker"><select id="conn_key" data-change-action="static-key-status"><option value="" data-i18n="connections:auto.no_private_key">不使用私钥</option></select><button type="button" data-action="static-key-refresh" data-i18n="common:auto.refresh">刷新</button></div>
          <div id="keyStatus" class="key-status muted" data-i18n-skip="true">未选择私钥</div>
          <div class="upload-line"><label class="file-picker"><input id="key_upload" type="file" accept="*/*" data-change-action="static-file-picker"><span class="file-picker-button" data-i18n="common:auto.choose_file">选择文件</span><span class="file-picker-name" data-i18n="common:auto.not_selected">未选择文件</span></label><button type="button" data-action="static-key-upload" data-i18n="connections:auto.upload_key">上传到当前密钥目录</button></div>
          <div class="actions"><button type="button" data-action="static-key-status" data-i18n="connections:auto.check_permissions">检查权限</button><button type="button" data-action="static-key-repair" data-i18n="connections:auto.repair_permissions">一键修复权限</button></div>
          <div class="grid connection-key-options">

<template id="importTpl">
  <div class="panel" id="importMainPanel">
    <div class="workspace-head">
      <div>
        <h2 data-i18n="navigation:auto.import_export">导入导出</h2>
        <div class="subtitle" data-i18n="settings:auto.import_migration">迁移 SSH config、数据库备份和连接配置快照。</div>
      </div>
    </div>
    <div class="grid import-main-grid">
      <section id="import-source" class="import-section">
        <h3><i data-lucide="file-input"></i><span data-i18n="settings:auto.ssh_config_import_export">SSH config 导入导出</span></h3>
        <label data-i18n="settings:auto.upload_config">上传配置文件</label>
        <div class="upload-line"><label class="file-picker"><input id="config_upload" type="file" accept="*/*" data-change-action="static-file-picker"><span class="file-picker-button" data-i18n="common:auto.choose_file">选择文件</span><span class="file-picker-name" data-i18n="common:auto.not_selected">未选择文件</span></label><button data-action="static-import-config" data-i18n="settings:auto.upload_parse">上传解析</button></div>
        <label data-i18n="settings:auto.paste_config">或粘贴 config 内容</label><textarea id="config_text" placeholder="Host demo&#10;  HostName example.com&#10;  User root&#10;  LocalForward 6010 127.0.0.1:6868"></textarea>
        <div class="actions"><button data-action="static-import-text" data-i18n="settings:auto.paste_parse">粘贴解析</button></div>
        <div id="import-results" class="import-results-block">
          <div class="import-results-head"><h3><i data-lucide="list-checks"></i><span data-i18n="settings:auto.import_results">导入结果</span></h3><div class="actions"><button id="bindImportKeysBtn" data-action="static-import-bind-keys" data-i18n="settings:auto.bind_keys" hidden>绑定私钥</button><button id="batchTestBtn" data-action="static-import-test" data-i18n="settings:auto.batch_test">批量测试</button><button id="batchSaveBtn" class="primary" data-action="static-import-save" data-i18n="settings:auto.batch_save">批量保存</button></div></div>
          <div id="importResults"></div>
        </div>
        <div class="import-export-config">
          <h3><i data-lucide="file-output"></i><span data-i18n="settings:auto.export_config">导出 SSH config</span></h3>
          <textarea id="export_text" readonly></textarea>
          <div class="actions"><button data-action="static-export-config" data-i18n="settings:auto.generate_export">生成导出内容</button><button data-action="static-export-copy" data-i18n="common:auto.copy">复制</button></div>
        </div>
      </section>
      <section id="import-export" class="import-section">
        <h3><i data-lucide="database-backup"></i><span data-i18n="settings:auto.database_import_export">数据库导入导出</span></h3>
        <div class="actions"><button data-action="static-backup-database" data-i18n="settings:auto.download_database">下载数据库备份</button><button id="backupBundleBtn" data-action="static-backup-bundle" data-i18n="settings:auto.download_bundle" hidden>下载加密迁移包</button></div>
        <label data-i18n="settings:auto.restore_database">恢复数据库 / 加密迁移包</label>
        <div class="upload-line"><label class="file-picker"><input id="db_restore_upload" type="file" accept=".db,.json,.termabackup,.tdbackup,.tdbackup.json,application/json,application/octet-stream,*/*" data-change-action="static-file-picker"><span class="file-picker-button" data-i18n="common:auto.choose_file">选择文件</span><span class="file-picker-name" data-i18n="common:auto.not_selected">未选择文件</span></label><button class="danger" data-action="static-backup-restore" data-i18n="settings:auto.upload_restore">上传恢复</button></div>
        <div id="backupBundleNote" class="muted" data-i18n-skip="true">普通备份使用 .db 文件；启用配置加密后会显示 .termabackup 加密迁移包下载入口。</div>
        <div class="import-export-config legacy-brand-migration-block">
          <h3><i data-lucide="refresh-cw"></i><span data-i18n="settings:auto.legacy_migration">旧版数据迁移</span></h3>
          <div id="legacyBrandMigration"></div>
        </div>
      </section>
    </div>
  </div>
</template>
